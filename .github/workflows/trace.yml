name: trace

# Redraws PL. VIII (the contribution trace) from the GitHub API once a day.
# Only tools/trace.json and assets/trace-*.svg are touched; nothing is
# committed when they have not changed.

on:
  schedule:
    - cron: "17 1 * * *"   # 06:47 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Redraw the trace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build_assets.py --fetch trace

      - name: Commit if it moved
        run: |
          git add tools/trace.json assets/trace-dark.svg assets/trace-light.svg
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Redraw trace"
          git push
