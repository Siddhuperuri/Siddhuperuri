<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="388" viewBox="0 0 1280 388" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="t d"><title id="t">Vantage: explorable 3d artwork</title><desc id="d">An explorable 3d version of siddhartha: five layers of light at five depths that sum into a name from one point, and only if you stop. four places along one axis, with no cuts between them. one law governs it: stillness resolves, motion scatters, attention pulls.</desc><style>@keyframes nd{0%,62%,100%{transform:translate(0,0)}76%{transform:translate(5px,0)}}.nd{animation:nd 3.6s ease-in-out infinite}@keyframes ndd{0%,62%,100%{transform:translate(0,0)}76%{transform:translate(0,4px)}}.ndd{animation:ndd 3.6s ease-in-out infinite}@keyframes dw{0%{stroke-dasharray:1;stroke-dashoffset:1}99%{stroke-dasharray:1;stroke-dashoffset:0}100%{stroke-dasharray:none}}@keyframes fi{from{opacity:0}}.ln{animation:dw 1.2s cubic-bezier(.2,.7,.1,1) both}.lr{animation:fi 1s ease .25s both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><path id="g0" d="M0 0L0 -100M0 -100L30 -100A30 28 0 0 1 60 -72A30 28 0 0 1 30 -44L0 -44"/><path id="g1" d="M0 -100L0 0L54 0"/><path id="g2" d="M6 0L6 -9"/><path id="g3" d="M0 -100L40 0L80 -100"/><path id="g4" d="M20 0L20 -100M0 -100L40 -100M0 0L40 0"/><path id="g5" d="M0 0L42 -100L84 0M13.4 -32L70.6 -32"/><path id="g6" d="M0 0L0 -100L70 0L70 -100"/><path id="g7" d="M0 -100L80 -100M40 -100L40 0"/><path id="g8" d="M81.2 -82.1A46 50 0 0 0 7.6 -77.5A46 50 0 0 0 32.8 -2.1A46 50 0 0 0 92 -50L50 -50"/><path id="g9" d="M58 -100L0 -100L0 0L58 0M0 -50L48 -50"/><path id="g10" d="M0 0L70 -100M0 -100L70 0"/><path id="g11" d="M46 -100A46 50 0 0 0 6.2 -25A46 50 0 0 0 85.8 -25A46 50 0 0 0 46 -100"/><path id="g12" d="M0 0L0 -100M0 -100L36 -100A30 25 0 0 1 66 -75A30 25 0 0 1 36 -50L0 -50M30 -50L72 0"/><path id="g13" d="M0 0L0 -100M0 -100L30 -100A28 25 0 0 1 58 -75A28 25 0 0 1 30 -50L0 -50M0 -50L34 -50A