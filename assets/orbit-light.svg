<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="t d"><title id="t">ORBIT, a knowledge and document platform</title><desc id="d">Plate III. The title ORBIT, drawn as exact construction geometry: public code, still in development. A pipeline of seven stages: parse, normalize, chunk, embed and index are built and drawn solid; retrieval and chat do not exist yet and are drawn dashed. An ember pulse runs through the built stages and stops at index. Below, the dependency direction enforced in CI: composition, api, application and infrastructure, domain, core.</desc><style>@keyframes pu{0%{transform:translateX(-418.7px);opacity:0}8%{opacity:1}70%{transform:translateX(0);opacity:1}82%,100%{transform:translateX(14px);opacity:0}}.pu{animation:pu 5.5s cubic-bezier(.45,0,.4,1) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><path id="g0" d="M0 0L0 -100M0 -100L30 -100A30 28 0 0 1 60 -72A30 28 0 0 1 30 -44L0 -44"/><path id="g1" d="M0 -100L0 0L54 0"/><path id="g2" d="M6 0L6 -9"/><path id="g3" d="M20 0L20 -100M0 -100L40 -100M0 0L40 0"/><path id="g4" d="M46 -100A46 50 0 0 0 6.2 -25A46 50 0 0 0 85.8 -25A46 50 0 0 0 46 -100"/><path id="g5" d="M0 0L0 -100M0 -100L36 -100A30 25 0 0 1 66 -75A30 25 0 0 1 36 -50L0 -50M30 -50L72 0"/><path id="g6" d="M0 0L0 -100M0 -100L30 -100A28 25 0 0 1 58 -75A28 25 0 0 1 30 -50L0 -50M0 -50L34 -50A28 25 0 0 1 62 -25A28 25 0 0 1 34 0L0 0"/><path id="g7" d="M0 -100L80 -100M40 -100L40 0"/><path id="g8" d="M0 -50L90 -50"/><path id="g9" d="M0 0L0 -100M64 -100L0 -40M18 -58L68 0"/><path id="g10" d="M0 0L0 -100L70 0L70 -100"/><path id="g11" d="M0 -100L22 0L50 -62L78 0L100 -100"/><path id="g12" d="M58 -100L0 -100L0 0L58 0M0 -50L48 -50"/><path id="g13" d="M0 0L0 -100L38 -100A44 50 0 0 1 82 -50A44 50 0 0 1 38 0L0 0"/><path id="g14" d="M81.2 -82.1A46 50 0 0 0 7.6 -77.5A46 50 0 0 0 32.8 -2.1A46 50 0 0 0